name: '站点构建环境'
description: '统一构建环境：Python 3.12 + Node 20 + pandoc 3.1.3（Ubuntu 24.04 发行版包，含重试与版本断言）'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: 安装 pandoc（apt，对齐本机 3.1.3+ds）
      shell: bash
      run: |
        set -euo pipefail
        # 镜像源偶发超时：重试 3 次、单请求 30s 超时（v0.3.8 首跑曾因 apt 卡 7 分钟失败）
        sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30
        sudo apt-get install -y -qq pandoc -o Acquire::Retries=3 -o Acquire::http::Timeout=30
    - name: 版本断言（漂移即红）
      shell: bash
      run: |
        set -euo pipefail
        v=$(pandoc --version | head -1)
        echo "$v"
        case "$v" in
          "pandoc 3.1.3"*) ;;
          *) echo "::error title=pandoc 版本漂移::期望 3.1.3（Ubuntu 24.04 发行版包），实得：$v"; exit 1 ;;
        esac
        python3 -V
        node --version
