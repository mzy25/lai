name: '站点构建环境'
description: '统一构建环境：Python 3.12 + Node 20 + pip 钉版构建依赖（markdown-it-py）'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: 安装构建依赖（钉版）
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet -r build/requirements-build.txt
    - name: 版本断言（漂移即红）
      shell: bash
      run: |
        set -euo pipefail
        want=$(sed -n 's/^markdown-it-py==//p' build/requirements-build.txt)
        python3 - "$want" <<'PY'
        import sys
        import markdown_it
        got = markdown_it.__version__
        print(f"markdown-it-py {got}（要求 {sys.argv[1]}）")
        assert got == sys.argv[1], f"期望 {sys.argv[1]}，实得 {got}"
        PY
        python3 -V
        node --version
