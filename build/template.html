<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{COMMON_HEAD}}
<title>AI 五篇入门读物合集</title>
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="highlight/github.min.css" id="hljs-theme">
<link rel="stylesheet" href="highlight/atom-one-dark.min.css" id="hljs-theme-dark" media="(prefers-color-scheme: dark)">
<script src="katex/katex.min.js" defer></script>
<script src="katex/contrib/auto-render.min.js" defer></script>
<script src="highlight/highlight.min.js" defer></script>
<style>
/* ===== 基础（reset/tokens/body/链接/可访问性由模板共享片段注入） ===== */
:root {
  --code-bg: #f3f4f6; --sidebar-w: 300px; --fs: 17px;
  --blockquote-bg: #fafbfc;
  --th-bg: #f3f4f6; --row-alt: #fafafa; --pre-bg: #f3f4f6; --pre-ink: #1f2937;
  --summary-bg: #f9fafb;
}
/* 深色模式：data-theme 为唯一开关（无存储时由 head 引导脚本按系统偏好预设） */
:root[data-theme="dark"] {
  --code-bg: #273244; --blockquote-bg: #1a2332;
  --th-bg: #273244; --row-alt: #1a2332; --pre-bg: #282c34; --pre-ink: #e5e7eb;
  --summary-bg: #273244;
}
:root[data-theme="dark"] img { filter: brightness(0.9); }
html { scroll-behavior:smooth; }
body { line-height:1.9; font-size:1rem; }
a { text-decoration:none; overflow-wrap:anywhere; word-break:break-word; }

/* ===== 阅读工具条（字号 / 主题） ===== */
.tools { position:fixed; top:10px; right:12px; z-index:96; display:flex; gap:6px; }
.tools button, .tools a { border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  border-radius:999px; padding:4px 10px; font-size:0.8rem; cursor:pointer; line-height:1.4;
  text-decoration:none; display:inline-block; }
.tools button:hover, .tools a:hover { color:var(--accent); border-color:var(--accent); }
@media (max-width: 640px) { .tools { top:6px; right:6px; gap:4px; }
  .tools button { padding:3px 8px; font-size:0.75rem; } }

/* ===== 正文版心（块级图表不受限） ===== */
.doc-section p, .doc-section li, .doc-section blockquote { max-width:44em; }
.table-wrap p, .table-wrap li, .selfcheck-bubble p, .selfcheck-bubble li,
.term::after { max-width:none; }
/* 重点短语轻微高亮（仅正文段落，避免标题/表格噪声） */
.doc-section p strong { background:linear-gradient(transparent 62%, var(--accent-soft) 0); }
/* 文档元信息（字数 / 阅读时长，构建端注入） */
.doc-meta { font-size:0.86rem; color:var(--ink-soft); margin:-6px 0 26px; }
/* ===== 阅读型 callout ===== */
.doc-section .takeaway { background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--accent); border-radius:12px; padding:4px 20px 8px; margin:26px 0; }
.doc-section .takeaway h3 { margin-top:18px; border-bottom:none; padding-bottom:0; }
.doc-section details { border-style:dashed; }

/* 图片全局防溢出 */
img { max-width:100%; height:auto; }

/* ===== 布局 ===== */
.layout { display:flex; max-width:1500px; margin:0 auto; min-height:100vh; }

/* 侧边栏 */
.sidebar { width:var(--sidebar-w); flex-shrink:0; background:var(--card);
           border-right:1px solid var(--line); position:sticky; top:0; height:100vh;
           overflow-y:auto; padding:20px 14px; z-index:50; transition:margin-left .3s ease; }
.sidebar-header { font-weight:700; font-size:1.05rem; padding:6px 10px 14px;
                  border-bottom:1px solid var(--line); margin-bottom:10px;
                  color:var(--ink); display:flex; align-items:center; gap:8px; }
.sidebar-header .brand { font-size:0.8rem; color:var(--ink-soft); font-weight:400; }
.toc { list-style:none; font-size:0.86rem; }
.toc li { margin:1px 0; }
.toc a { display:block; padding:4px 10px; border-radius:5px; color:var(--ink-soft);
         transition:all .15s; border-left:2px solid transparent; }
.toc a:hover { background:var(--accent-soft); color:var(--accent); }
.toc a.active { background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
.toc .toc-chapter.has-active > .toc-chapter-head > a { color:var(--accent); }
.toc .lvl-2 { padding-left:22px; }
.toc .lvl-3 { padding-left:38px; font-size:0.8rem; }
.toc .lvl-4 { padding-left:52px; font-size:0.78rem; color:#9ca3af; }
/* 折叠式目录：章 = 可展开组，默认收起 */
.toc .toc-chapter { margin:0; }
.toc .toc-chapter-head { display:flex; align-items:center; cursor:pointer;
                         padding:6px 0; font-weight:600; }
.toc .toc-chapter-head::before { content:'▸'; display:inline-block; width:16px;
                                 color:var(--ink-soft); transition:transform .15s; font-size:0.75rem; }
.toc .toc-chapter.open .toc-chapter-head::before { transform:rotate(90deg); }
.toc .toc-chapter-head a { flex:1; font-weight:600; }
.toc .toc-children { display:none; list-style:none; padding:0; }
.toc .toc-chapter.open .toc-children { display:block; }
.toc .toc-children .lvl-3 { padding-left:22px; }
.toc .toc-children .lvl-4 { padding-left:38px; font-size:0.78rem; color:#9ca3af; }
.toc .doc-head { font-weight:700; color:var(--ink); margin-top:8px; font-size:0.9rem; }
.toc .doc-head a { color:var(--ink); }
.toc .doc-head a:hover { color:var(--accent); }

/* 侧边栏折叠按钮（窄屏） */
.sidebar-toggle { display:none; }
/* 桌面端：侧边目录由悬浮开关手动收起/展开（滚动不自动改变） */
.layout.collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w));
  visibility:hidden; transition:margin-left .3s ease, visibility 0s linear .3s; }
.sidebar-float-toggle { position:fixed; left:calc(var(--sidebar-w) - 18px); top:14px; z-index:70; width:38px; height:38px;
  border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
  font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 6px rgba(0,0,0,.14); transition:border-color .15s, color .15s; }
.sidebar-float-toggle::before { content:'☰'; }
.sidebar-float-toggle:hover { border-color:var(--accent); color:var(--accent); }
/* 收起时开关仍锚定目录右缘位置，不单独跑到最左占位 */

/* 当前位置提示条 */
.whereami { position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:80;
  max-width:60vw; padding:5px 16px; border-radius:999px; background:var(--card);
  border:1px solid var(--line); color:var(--ink-soft); font-size:0.8rem;
  box-shadow:0 1px 6px rgba(0,0,0,.10); opacity:0; transition:opacity .25s;
  pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.whereami.show { opacity:1; }
@media (max-width: 1024px) { .whereami { max-width:82vw; } }

/* 跨篇引用可点跳转 */
.xref { text-decoration:underline dotted; text-underline-offset:3px; }
.xref:hover { background:var(--accent-soft); text-decoration:underline; }

/* 术语 hover 卡片（data-def 悬浮释义） */
.term { position:relative; border-bottom:1px dotted var(--ink-soft); cursor:help; }
.term::after { content:attr(data-def); position:absolute; left:0; bottom:calc(100% + 8px); z-index:95;
  width:max-content; max-width:min(320px, 72vw); background:var(--card); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:0.84rem;
  line-height:1.65; box-shadow:0 4px 16px rgba(0,0,0,.16); white-space:normal;
  visibility:hidden; opacity:0; transition:opacity .15s; font-weight:400; }
.term:hover::after, .term:focus::after { visibility:visible; opacity:1; }

/* 文档切换 */
.doc-switch { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
.doc-btn { flex:1; min-width:60px; padding:6px 4px; border:1px solid var(--line);
           background:var(--card); color:var(--ink-soft); border-radius:6px;
           cursor:pointer; font-size:0.82rem; transition:all .15s; }
.doc-btn:hover { border-color:var(--accent); color:var(--accent); }
.doc-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

/* 搜索框 */
.search-box { margin:10px 0; }
.search-box input { width:100%; padding:8px 10px; border:1px solid var(--line);
                    border-radius:6px; font-size:0.88rem; background:var(--card);
                    color:var(--ink); outline:none; }
.search-box input:focus { border-color:var(--accent); }
.search-box input::placeholder { color:var(--ink-soft); opacity:.7; }

/* 主内容 */
.main { flex:1; min-width:0; padding:36px 48px 80px; }
.doc-section { max-width:1080px; margin:0 auto 60px; }
.doc-section + .doc-section { border-top:2px solid var(--line); padding-top:48px; }

/* 性能：超长页面滚动时跳过视口外内容的渲染/绘制 */
.chapter {
  content-visibility: auto;
  contain-intrinsic-size: auto 800px;
}
figure, pre, .table-wrap, details, blockquote {
  content-visibility: auto;
  contain-intrinsic-size: auto 300px;
}
.doc-title { font-size:1.9rem; font-weight:800; margin-bottom:8px; color:var(--ink);
             padding-bottom:12px; border-bottom:3px solid var(--accent); }
.doc-section > .doc-title + * { margin-top:20px; }

/* 标题 */
h2 { font-size:1.55rem; color:var(--ink); margin:40px 0 18px; padding-bottom:8px;
     border-bottom:1px solid var(--line); scroll-margin-top:64px; }
h3 { font-size:1.25rem; margin:30px 0 14px; color:var(--ink); scroll-margin-top:64px; }
h4 { font-size:1.1rem; margin:24px 0 12px; color:var(--ink-soft); scroll-margin-top:64px; }
h5, h6 { font-size:1rem; margin:20px 0 10px; color:var(--ink-soft); scroll-margin-top:64px; }
.doc-title { scroll-margin-top:64px; }
h2, h3, h4 { font-weight:700; }

/* 正文 */
p { margin:0 0 18px; }
ul, ol { margin:0 0 16px 26px; }
li { margin:4px 0; }
strong { font-weight:700; }

/* 引用 */
blockquote { background:var(--blockquote-bg); padding:14px 18px;
             margin:18px 0; border-radius:0 6px 6px 0; color:var(--ink-soft); }
blockquote > p:last-child { margin-bottom:0; }

/* 公式 */
.katex { font-size:1.05em; }
.math.display { display:block; margin:18px 0; overflow-x:auto; overflow-y:hidden; padding:4px 0; max-width:100%; }
span.math.inline { white-space:nowrap; overflow:visible; display:inline-block;
                   vertical-align:baseline; padding:1px 0; }
span.math.inline.math-long { white-space:normal; overflow:visible; }
/* KaTeX 内部强制 nowrap，math-long 需覆盖让长公式换行 */
span.math.inline.math-long .katex,
span.math.inline.math-long .katex .base { white-space:normal !important; }
span.math.inline.math-long .katex .base { width:auto !important; }
/* 注：行内公式不再使用滚动容器（overflow 非 visible 会把 inline-block 基线改为底边，
   使公式整体偏离正文基线）；手机端超宽公式接受溢出。 */

/* 表格 */
.table-wrap { overflow-x:auto; margin:20px 0; }
table { border-collapse:collapse; width:100%; font-size:0.92rem; }
th, td { border:1px solid var(--line); padding:8px 12px; text-align:left; white-space:normal; }
th { background:var(--th-bg); font-weight:700; }
tr:nth-child(even) td { background:var(--row-alt); }

/* 代码 */
code { background:var(--code-bg); padding:2px 6px; border-radius:4px;
       font-family:"SF Mono",Consolas,monospace; font-size:0.88em; }
pre { background:var(--pre-bg); color:var(--pre-ink); padding:16px; border-radius:8px;
      overflow-x:auto; margin:18px 0; font-size:0.88rem; line-height:1.6; }
pre code { background:transparent; color:inherit; padding:0; }
/* 非代码的“逻辑链/示意图”块：不用深色代码框，改用浅色卡片，避免黑框 */
pre:not(.sourceCode):not(.hljs) {
  background: var(--blockquote-bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
}
pre:not(.sourceCode):not(.hljs) code {
  background: transparent;
  color: inherit;
  font-family: inherit;
}
/* 代码高亮：白底主题覆盖（浅色模式） */
.hljs { background:transparent !important; border-radius:8px; }
code.hljs, pre.hljs { padding:0; }

/* details 折叠 */
details { margin:14px 0; border:1px solid var(--line); border-radius:8px;
          background:var(--card); overflow:hidden; }
summary { cursor:pointer; padding:10px 16px; font-weight:600; color:var(--ink);
          background:var(--summary-bg); user-select:none; list-style:none; position:relative; }
summary::-webkit-details-marker { display:none; }
summary::before { content:"▸"; display:inline-block; margin-right:8px; color:var(--accent);
                  transition:transform .2s; }
details[open] summary::before { transform:rotate(90deg); }
details[open] summary { border-bottom:1px solid var(--line); }
details > *:not(summary) { padding:10px 16px; }
details > p { padding:10px 16px; }

/* 自检题旁的内嵌提示/答案（按住浮现，松开消失） */
.selfcheck-popup { position:relative; display:flex; justify-content:flex-end; gap:6px; margin:6px 0 2px; }
.selfcheck-btn { padding:2px 10px; font-size:0.82rem; font-weight:600; border:1px solid var(--line); border-radius:7px; background:var(--card); color:inherit; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none; }
.selfcheck-btn:hover { border-color:var(--accent,#888); }
.selfcheck-btn:active, .selfcheck-btn.peeking { background:var(--accent,#4a6fa5); color:#fff; border-color:transparent; }
.selfcheck-bubble { position:absolute; z-index:60; top:calc(100% + 6px); right:0; width:min(560px, 100%); max-height:65vh; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:10px 14px; font-size:0.9rem; line-height:1.65; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 10px 28px rgba(0,0,0,.16); }
.selfcheck-bubble.flip-up { top:auto; bottom:calc(100% + 6px); }
.selfcheck-bubble p { margin:0.5em 0; }
.selfcheck-bubble p:first-child { margin-top:0; }
.selfcheck-bubble p:last-child { margin-bottom:0; }

/* 图片 */
figure { margin:20px 0; text-align:center; }
figure img { max-width:100%; height:auto; border-radius:6px; }
figcaption { margin-top:6px; font-size:0.85rem; color:var(--ink-soft); }

/* 上标引用 */
sup { font-size:0.7em; color:var(--accent); }

/* 返回顶部 */
.back-top { position:fixed; right:24px; bottom:24px; width:40px; height:40px;
            border-radius:50%; background:var(--accent); color:#fff; border:none;
            font-size:1.1rem; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.2);
            display:none; z-index:60; }
.back-top.show { display:block; }

/* 进度条 */
.progress { position:fixed; top:0; left:0; height:3px; background:var(--accent);
            width:0; z-index:100; transition:width .1s; }

/* ===== 响应式 ===== */
@media (max-width: 1024px) {
  .layout { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:relative; max-height:none;
             border-right:none; border-bottom:1px solid var(--line); padding:12px; }
  .sidebar-header { margin-bottom:6px; }
  .toc { display:none; }
  .toc.open { display:block; max-height:60vh; overflow-y:auto; }
  .sidebar-toggle { display:block; background:var(--accent); color:#fff; border:none;
                    padding:8px 14px; border-radius:6px; cursor:pointer; font-size:0.95rem;
                    margin-bottom:10px; }
  .layout.collapsed .sidebar { margin-left:0; }
  .sidebar-float-toggle { display:none; }
  .main { padding:24px 18px 60px; }
}
@media (max-width: 640px) {
  .main { padding:16px 12px 48px; }
  .doc-title { font-size:1.5rem; }
  h2 { font-size:1.3rem; }
  .doc-section { margin-bottom:36px; }
}

/* ===== 打印样式 ===== */
@media print {
  .sidebar, .sidebar-toggle, .sidebar-float-toggle, .back-top, .progress, .tools { display:none !important; }
  .layout { display:block; }
  .main { padding:0; max-width:100%; }
  .doc-section { max-width:100%; margin:0 0 30px; page-break-after:always; }
  .doc-section:last-child { page-break-after:auto; }
  details { border:none; margin:8px 0; }
  details > *:not(summary) { padding:0; }
  details[open] summary { border-bottom:none; }
  /* 打印：自检答案/提示直接展开为正文（按住交互在纸上不可用） */
  .selfcheck-btn { display:none !important; }
  .selfcheck-bubble[hidden] { display:block !important; position:static; max-height:none; box-shadow:none; margin:6px 0 10px; }
  pre { white-space:pre-wrap; word-break:break-all; }
  .math.display, span.math.inline { overflow:visible !important; white-space:normal !important; }
  a { color:var(--ink); text-decoration:none; }
  figure { page-break-inside:avoid; }
  table { font-size:0.8rem; }
  h2, h3, h4 { page-break-after:avoid; }
}
</style>
<noscript><style>
/* 无 JS：按钮不可用，直接展开全部自检提示/答案 */
.selfcheck-btn { display:none !important; }
.selfcheck-bubble[hidden] { display:block !important; position:static; max-height:none; box-shadow:none; margin:6px 0 10px; }
</style></noscript>
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="progress" id="progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<div class="tools" id="readTools">
  <a href="cards.html" title="学习卡">学习卡</a>
  <button id="fsDown" type="button" title="减小字号">A−</button>
  <button id="fsReset" type="button" title="默认字号">A</button>
  <button id="fsUp" type="button" title="增大字号">A+</button>
  <button id="themeToggle" type="button" title="切换深浅色">◐</button>
</div>
<button class="sidebar-float-toggle" id="sidebarFloatToggle" title="目录"></button>
<div class="whereami" id="whereami" aria-live="polite"></div>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">📚 目录 <span class="brand">· AI 五篇合集</span></div>
    <button class="sidebar-toggle" id="tocToggle">☰ 目录</button>
    <div class="doc-switch">
{{DOC_BTNS}}
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="🔍 搜索标题…" autocomplete="off">
    </div>
    <nav class="toc" id="toc"></nav>
  </aside>
  <main class="main" id="main">
{{BODY}}
  </main>
</div>
<button class="back-top" id="backTop" title="回到顶部">↑</button>

<script>
/* ===== 构建目录 ===== */
(function () {
  const toc = document.getElementById('toc');
  const sections = document.querySelectorAll('.doc-section');
  const docBtns = document.querySelectorAll('.doc-btn');

  sections.forEach(function (sec) {
    const title = sec.dataset.title;
    // 文档级标题
    const headLi = document.createElement('li');
    headLi.className = 'doc-head';
    const headA = document.createElement('a');
    headA.href = '#' + sec.id;
    headA.textContent = title;
    headLi.appendChild(headA);
    toc.appendChild(headLi);

    // 章节标题（h2 = 原 h1, h3 = 原 h2, h4 = 原 h3）
    // 按章分组：h2 是章，其下 h3/h4 是节的子项
    let currentChapter = null;   // 当前章的 <li>（h2 容器）
    let currentChapterList = null; // 当前章的子项 <ul>
    sec.querySelectorAll('h2, h3, h4').forEach(function (h) {
      if (h.classList.contains('doc-title')) return; // 跳过文档大标题
      if (h.textContent.trim() === title) return;   // 跳过与文档标题重复的内部 h1
      if ((h.dataset.label || '').trim() === '目录') return; // 跳过文档内部"目录"章
      const id = h.id;
      if (!id) return;
      const a = document.createElement('a');
      a.href = '#' + id;
      // 标题文本：优先用构建端注入的 data-label（KaTeX 渲染前的干净文本）
      a.textContent = h.dataset.label || h.textContent;
      if (h.tagName === 'H2') {
        // 新章：创建组容器（默认收起）
        currentChapter = document.createElement('li');
        currentChapter.className = 'toc-chapter';
        const headWrapper = document.createElement('div');
        headWrapper.className = 'toc-chapter-head';
        headWrapper.setAttribute('role', 'button');
        headWrapper.setAttribute('tabindex', '0');
        headWrapper.setAttribute('aria-expanded', 'false');
        headWrapper.appendChild(a);
        currentChapter.appendChild(headWrapper);
        currentChapterList = document.createElement('ul');
        currentChapterList.className = 'toc-children';
        currentChapter.appendChild(currentChapterList);
        toc.appendChild(currentChapter);
        // 点击章名：默认锚点跳转到该章标题，并展开/收起子项
        // 注意：用局部变量捕获当前章，避免闭包引用外层最终值
        (function (chapter) {
          headWrapper.addEventListener('click', function () {
            const open = chapter.classList.toggle('open');
            headWrapper.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
          headWrapper.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); headWrapper.click(); }
          });
        })(currentChapter);
      } else {
        // h3/h4：挂到当前章的子列表
        if (!currentChapterList) {
          // 章前的小节（理论不会发生，兜底直接挂 toc）
          const orphanLi = document.createElement('li');
          orphanLi.className = 'lvl-' + h.tagName.toLowerCase();
          orphanLi.appendChild(a);
          toc.appendChild(orphanLi);
          return;
        }
        const li = document.createElement('li');
        li.className = 'lvl-' + h.tagName.toLowerCase();
        li.appendChild(a);
        currentChapterList.appendChild(li);
      }
    });
  });

  /* ===== 侧栏跟随：高亮项始终留在侧栏可视区（只滚侧栏，不动页面） ===== */
  function keepTocActiveVisible(a) {
    if (!a || window.innerWidth <= 1024) return;
    const sb = document.querySelector('.sidebar');
    if (!sb) return;
    const ar = a.getBoundingClientRect();
    const sr = sb.getBoundingClientRect();
    const padTop = 56, padBottom = 32;
    if (ar.top < sr.top + padTop) {
      sb.scrollTop += ar.top - sr.top - padTop;
    } else if (ar.bottom > sr.bottom - padBottom) {
      sb.scrollTop += ar.bottom - sr.bottom + padBottom;
    }
  }

  /* ===== 滚动高亮（IntersectionObserver） ===== */
  const links = toc.querySelectorAll('a');
  const map = new Map();
  links.forEach(function (a) {
    const id = a.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) map.set(el, a);
  });

  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        links.forEach(function (a) { a.classList.remove('active'); });
        const a = map.get(entry.target);
        if (a) a.classList.add('active');
        // 自动展开当前章（收起其他章），父章标题同步着色——动态层次随阅读位置变化
        const chapter = a && a.closest('.toc-chapter');
        if (chapter) {
          toc.querySelectorAll('.toc-chapter').forEach(function (c) {
            c.classList.toggle('open', c === chapter);
            c.classList.toggle('has-active', c === chapter);
            const hd = c.querySelector('.toc-chapter-head');
            if (hd) hd.setAttribute('aria-expanded', c.classList.contains('open') ? 'true' : 'false');
          });
        }
        keepTocActiveVisible(a);
        // 联动文档切换按钮
        const sec = entry.target.closest('.doc-section');
        if (sec) {
          docBtns.forEach(function (b) {
            b.classList.toggle('active', b.dataset.doc === sec.id);
          });
        }
        // 当前位置提示条
        const wa = document.getElementById('whereami');
        if (wa) {
          const ch = entry.target.closest('.chapter');
          const chEl = ch && ch.querySelector('h2');
          const chName = chEl && chEl.dataset.label ? chEl.dataset.label : '';
          wa.textContent = chName ? sec.dataset.title + ' · ' + chName : sec.dataset.title;
          wa.classList.add('show');
          clearTimeout(wa._t);
          wa._t = setTimeout(function () { wa.classList.remove('show'); }, 2600);
        }
      }
    });
  }, { rootMargin: '-10% 0px -70% 0px' });

  map.forEach(function (a, el) { observer.observe(el); });

  /* ===== 平滑滚动（保留浏览器行为，只做移动端目录收起） ===== */
  document.getElementById('tocToggle').addEventListener('click', function () {
    toc.classList.toggle('open');
  });
  links.forEach(function (a) {
    a.addEventListener('click', function () {
      if (window.innerWidth <= 1024) toc.classList.remove('open');
    });
  });

  /* ===== 文档切换 ===== */
  docBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = btn.dataset.doc;
      const sec = document.getElementById(id);
      if (sec) sec.scrollIntoView({ behavior: 'smooth' });
      docBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (window.innerWidth <= 1024) toc.classList.remove('open');
    });
  });

  /* ===== 搜索（过滤 TOC 标题） ===== */
  const searchInput = document.getElementById('searchInput');
  const allTocItems = toc.querySelectorAll('li');
  searchInput.addEventListener('input', function () {
    const q = searchInput.value.trim().toLowerCase();
    // 先收集原始结构（doc-head 始终显示，章节按匹配过滤）
    let matched = 0;
    allTocItems.forEach(function (li) {
      if (li.classList.contains('doc-head')) return; // 文档头始终显示
      const txt = li.textContent.toLowerCase();
      const show = !q || txt.includes(q);
      li.style.display = show ? '' : 'none';
      if (show) matched++;
    });
    // 搜索时展开所有含匹配的章（否则结果被折叠隐藏）
    if (q) {
      toc.querySelectorAll('.toc-chapter').forEach(function (c) {
        const hasMatch = c.querySelectorAll('li').length > 0 &&
          [...c.querySelectorAll('li')].some(function (li) { return li.style.display !== 'none'; });
        c.classList.toggle('open', hasMatch);
        const hd = c.querySelector('.toc-chapter-head');
        if (hd) hd.setAttribute('aria-expanded', hasMatch ? 'true' : 'false');
      });
    }
    // 无匹配提示
    let hint = document.getElementById('searchHint');
    if (!hint) {
      hint = document.createElement('div');
      hint.id = 'searchHint';
      hint.style.cssText = 'padding:8px 10px;color:var(--ink-soft);font-size:0.82rem;';
      toc.appendChild(hint);
    }
    hint.style.display = q && matched === 0 ? '' : 'none';
    hint.textContent = '无匹配标题';
    // 窄屏时显示结果
    if (q && window.innerWidth <= 1024) toc.classList.add('open');
  });

  /* ===== 返回顶部 + 进度条 ===== */
  const backTop = document.getElementById('backTop');
  const progress = document.getElementById('progress');
  let scrollTicking = false;
  let docScrollRange = 0;
  function updateDocScrollRange() {
    docScrollRange = document.documentElement.scrollHeight - window.innerHeight;
  }
  function updateScrollUI() {
    const st = window.scrollY;
    // content-visibility 下文档高度随渲染增长：每次滚动重算并钳制 100%
    docScrollRange = document.documentElement.scrollHeight - window.innerHeight;
    backTop.classList.toggle('show', st > 600);
    const pct = Math.min(100, docScrollRange > 0 ? (st / docScrollRange) * 100 : 0);
    progress.style.width = pct + '%';
    progress.setAttribute('aria-valuenow', Math.round(pct));
    scrollTicking = false;
  }
  updateDocScrollRange();
  window.addEventListener('resize', updateDocScrollRange);
  window.addEventListener('load', updateDocScrollRange);
  window.addEventListener('scroll', function () {
    if (!scrollTicking) {
      requestAnimationFrame(updateScrollUI);
      scrollTicking = true;
    }
  }, { passive: true });
  backTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  /* ===== 锚点修正：content-visibility 未渲染章节按估计高度，直接跳转会落偏 ===== */
  function settleAnchor(el) {
    // 顶部余量：悬浮目录开关（☰）高约 52px，标题锚点落在其下方
    var off = (el.matches && el.matches('h2, h3, h4, h5, h6, .doc-title')) ? 64 : 12;
    for (var i = 0; i < 8; i++) {
      var top = el.getBoundingClientRect().top;
      if (Math.abs(top - off) < 8) break;
      window.scrollBy(0, top - off);
    }
  }
  function fixHashAnchor() {
    if (!location.hash) return;
    var el;
    try { el = document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (e) { return; }
    if (!el) return;
    var chapters = document.querySelectorAll('.chapter');
    document.documentElement.style.scrollBehavior = 'auto';
    for (var i = 0; i < chapters.length; i++) chapters[i].style.contentVisibility = 'visible';
    void document.body.offsetHeight;              // 强制布局，让浏览器记住真实高度
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        settleAnchor(el);
        for (var j = 0; j < chapters.length; j++) chapters[j].style.contentVisibility = '';
        void document.body.offsetHeight;
        requestAnimationFrame(function () {
          settleAnchor(el);
          document.documentElement.style.scrollBehavior = '';
        });
      });
    });
  }
  window.addEventListener('load', fixHashAnchor);
  window.addEventListener('hashchange', fixHashAnchor);

  /* ===== 侧边目录：悬浮开关（手动收起/展开；滚动不自动改变状态） ===== */
  const sLayout = document.querySelector('.layout');
  document.getElementById('sidebarFloatToggle').addEventListener('click', function () {
    sLayout.classList.toggle('collapsed');
    if (!sLayout.classList.contains('collapsed')) {
      keepTocActiveVisible(toc.querySelector('a.active'));
    }
  });
})();

/* ===== 字号 / 主题：localStorage 记忆；hljs 深色主题随 data-theme 切换 ===== */
(function () {
  var FS_KEY = 'ai-primer-fs';
  var THEME_KEY = 'ai-primer-theme';
  var SIZES = ['15px', '17px', '19px'];
  function currentSize() {
    var v = getComputedStyle(document.documentElement).getPropertyValue('--fs').trim();
    return SIZES.indexOf(v) === -1 ? '17px' : v;
  }
  function applySize(px) {
    document.documentElement.style.setProperty('--fs', px);
    try { localStorage.setItem(FS_KEY, px); } catch (e) {}
  }
  function step(dir) {
    var i = SIZES.indexOf(currentSize());
    i = Math.max(0, Math.min(SIZES.length - 1, i + dir));
    applySize(SIZES[i]);
  }
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    var link = document.getElementById('hljs-theme-dark');
    if (link) link.media = (t === 'dark') ? 'all' : 'not all';
  }
  var down = document.getElementById('fsDown');
  var reset = document.getElementById('fsReset');
  var up = document.getElementById('fsUp');
  var toggle = document.getElementById('themeToggle');
  if (down) down.addEventListener('click', function () { step(-1); });
  if (reset) reset.addEventListener('click', function () { applySize('17px'); });
  if (up) up.addEventListener('click', function () { step(1); });
  if (toggle) toggle.addEventListener('click', function () {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
})();

/* ===== 代码高亮 + KaTeX 渲染（脚本 defer：在 DOMContentLoaded 后执行，T3 2026-10） ===== */
document.addEventListener('DOMContentLoaded', function () {
  if (window.hljs) { hljs.highlightAll(); }
  if (window.renderMathInElement) {
    renderMathInElement(document.body, {
      delimiters: [
        { left: '\\(', right: '\\)', display: false },
        { left: '\\[', right: '\\]', display: true }
      ],
      output: 'html',
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      throwOnError: false
    });
  }
});

/* ===== 术语 hover 卡片：每书首现术语包成 .term（悬浮显示释义） ===== */
(function () {
  // 术语卡由 build/glossary.json 生成（C4 唯一源）；改动术语请编辑该文件后重建
  var GLOSSARY = {{GLOSSARY}};
  function boundaryOK(data, i, len) {
    var prev = i > 0 ? data[i - 1] : '';
    var next = data[i + len] || '';
    var re = /[A-Za-z0-9_]/;
    return !(re.test(prev) || re.test(next));
  }
  document.querySelectorAll('.doc-section').forEach(function (sec) {
    var seen = {};
    GLOSSARY.forEach(function (g) {
      var term = g[0], def = g[1];
      if (seen[term]) return;
      var walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, {
        acceptNode: function (node) {
          var p = node.parentElement;
          if (p && p.closest('code, pre, a, sup, .katex, .math, .term')) return NodeFilter.FILTER_REJECT;
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var node;
      while ((node = walker.nextNode())) {
        var idx = node.data.indexOf(term);
        if (idx === -1 || !boundaryOK(node.data, idx, term.length)) continue;
        var span = document.createElement('span');
        span.className = 'term';
        span.setAttribute('data-def', def);
        span.setAttribute('aria-label', '术语：' + def);  // 读屏可及（T2 2026-10）
        span.setAttribute('tabindex', '0');
        span.textContent = term;
        var rest = node.splitText(idx + term.length);
        node.splitText(idx);
        var mid = node.nextSibling;
        node.parentNode.replaceChild(span, mid);
        seen[term] = true;
        break;
      }
    });
  });
})();

/* ===== 自检提示/答案：按住浮现，松开消失 ===== */
(function () {
  function hideAll(except) {
    document.querySelectorAll('.selfcheck-bubble').forEach(function (b) {
      if (b !== except) { b.hidden = true; }
    });
    document.querySelectorAll('.selfcheck-btn.peeking').forEach(function (btn) {
      if (!except || btn.nextElementSibling !== except) {
        btn.classList.remove('peeking');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }
  // 显示时按视口余量决定向下还是向上展开，保证气泡完整落在显示区内
  function placeBubble(btn, bubble) {
    bubble.classList.remove('flip-up');
    var r = btn.getBoundingClientRect();
    var below = window.innerHeight - r.bottom;
    if (below < 260 && r.top > below) bubble.classList.add('flip-up');
  }
  function showBubble(btn, bubble) {
    hideAll(bubble);
    bubble.hidden = false;
    btn.classList.add('peeking');
    btn.setAttribute('aria-expanded', 'true');
    placeBubble(btn, bubble);
  }
  function overBubble(ev, bubble) {
    var r = bubble.getBoundingClientRect();
    return ev.clientX >= r.left && ev.clientX <= r.right
        && ev.clientY >= r.top && ev.clientY <= r.bottom;
  }
  document.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.selfcheck-bubble')) return; // 气泡内滚动/选择不关闭
    var btn = e.target.closest && e.target.closest('.selfcheck-btn');
    if (!btn) { hideAll(null); return; }
    var bubble = btn.nextElementSibling;
    if (!bubble || !bubble.classList.contains('selfcheck-bubble')) return;
    e.preventDefault();
    showBubble(btn, bubble);
    function up(ev) {
      // 松开时指针落在气泡内 → 固定（可继续滚动/细读）；否则消失
      var pinned = ev.type === 'pointerup' && overBubble(ev, bubble);
      if (!pinned) {
        bubble.hidden = true;
        btn.classList.remove('peeking');
        btn.setAttribute('aria-expanded', 'false');
      }
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
    }
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
  // 键盘可达性：聚焦时回车/空格打开并聚焦气泡（可滚动阅读），Esc 或焦点离开关闭
  document.addEventListener('keydown', function (e) {
    var btn = e.target.closest && e.target.closest('.selfcheck-btn');
    if (btn && (e.key === ' ' || e.key === 'Enter')) {
      e.preventDefault();
      var bubble = btn.nextElementSibling;
      if (!bubble || !bubble.classList.contains('selfcheck-bubble')) return;
      if (bubble.hidden) {
        showBubble(btn, bubble);
        bubble.setAttribute('tabindex', '0');
        bubble.focus({ preventScroll: true });
      }
    }
    if (e.key === 'Escape') hideAll(null);
  });
  // 焦点离开自检题区域时关闭（键盘用户 Tab 走即收起）
  document.addEventListener('focusout', function (e) {
    var pop = e.target.closest && e.target.closest('.selfcheck-popup');
    if (!pop) return;
    setTimeout(function () {
      var a = document.activeElement;
      if (!a || !a.closest || !a.closest('.selfcheck-popup')) hideAll(null);
    }, 0);
  });
})();
