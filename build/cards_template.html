<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{COMMON_HEAD}}
<title>学习卡 · AI 五篇合集</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<style>
/* 基础 tokens/body/链接由模板共享片段注入；此处仅卡片扩展色 */
:root {
  --ok:#15803d; --no:#b91c1c; --echo-bg:#f3f4f6; --echo-line:#d1d5db;
}
:root[data-theme="dark"] {
  --ok:#4ade80; --no:#f87171; --echo-bg:#273244; --echo-line:#4b5563;
}
body { line-height:1.75; }

/* ===== 顶栏 ===== */
.top { position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line);
       padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
.top .title { font-weight:700; }
.top .title .sub { font-weight:400; font-size:0.8rem; color:var(--ink-soft); }
.top .back { font-size:0.85rem; }
.top select, .top button { border:1px solid var(--line); background:var(--bg); color:var(--ink);
       border-radius:8px; padding:5px 10px; font-size:0.85rem; cursor:pointer; }
.top button:hover, .top select:hover { border-color:var(--accent); color:var(--accent); }
.top label { font-size:0.85rem; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; }
.progress { font-size:0.82rem; color:var(--ink-soft); margin-left:auto; }
.printbar { width:100%; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
       border-top:1px dashed var(--line); padding-top:8px; font-size:0.8rem; color:var(--ink-soft); }

/* ===== 卡片 ===== */
.stage { max-width:860px; margin:26px auto 60px; padding:0 16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px;
        box-shadow:0 6px 20px rgba(0,0,0,.06); padding:20px 22px 14px; min-height:320px;
        display:flex; flex-direction:column; }
.card-head { display:flex; justify-content:space-between; gap:10px; font-size:0.8rem; color:var(--ink-soft); }
.card-head .meta { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-body { flex:1; padding:18px 2px; font-size:1.02rem; overflow-wrap:anywhere; }
.card-body .echo { background:var(--echo-bg); border-left:3px solid var(--echo-line);
        border-radius:6px; padding:8px 12px; margin-bottom:12px; color:var(--ink-soft); font-size:0.92rem; }
.card-body .hint { background:var(--accent-soft); border-radius:8px; padding:8px 12px; margin:10px 0;
        font-size:0.9rem; color:var(--ink-soft); }
.card-body p { margin:0 0 .8em; }
.card-body ol, .card-body ul { margin:0 0 .8em 1.3em; }
.card-body table { border-collapse:collapse; font-size:0.88rem; margin:.6em 0; }
.card-body th, .card-body td { border:1px solid var(--line); padding:4px 8px; }
.card-body blockquote { margin:.6em 0; padding-left:12px; border-left:3px solid var(--line); color:var(--ink-soft); }
.card-foot { display:flex; justify-content:space-between; gap:10px; font-size:0.78rem;
        color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:8px; }
.card-foot .src { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.nav { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.nav button { flex:1 1 110px; border:1px solid var(--line); background:var(--card); color:var(--ink);
        border-radius:10px; padding:9px 10px; font-size:0.9rem; cursor:pointer; }
.nav button:hover { border-color:var(--accent); color:var(--accent); }
.nav button.ok:hover { border-color:var(--ok); color:var(--ok); }
.nav button.no:hover { border-color:var(--no); color:var(--no); }
.nav button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.tip { text-align:center; font-size:0.78rem; color:var(--ink-soft); margin-top:12px; }

/* ===== 打印 ===== */
#printArea { display:none; }
@media print {
  .top, .stage, .tip { display:none !important; }
  #printArea { display:block; }
  body { background:#fff; }
  .pcard { border:1px dashed #999; border-radius:6px; padding:4mm; break-inside:avoid;
           page-break-inside:avoid; margin:0 0 3mm; font-size:11px; line-height:1.5; }
  .pcard .phead { font-size:9px; color:#666; margin-bottom:1.5mm; }
  .pcard .pecho { border-left:2px solid #bbb; padding-left:2mm; color:#555; margin-bottom:1.5mm; }
  .pcard .psrc { font-size:9px; color:#777; margin-top:1.5mm; }
  .sheet.mode-short .pcard { display:inline-block; vertical-align:top; width:48.5%; height:62mm;
           overflow:hidden; margin:0 1% 2mm 0; }
  .sheet.mode-short.print-back .pcard { height:62mm; }
  .sheet.mode-long .pcard { width:100%; }
  .card-back, .print-back .pfront { display:none; }
  .print-back .card-back { display:block; }
  #printArea .katex { font-size:1em; }
}
@media (max-width: 640px) {
  .stage { margin-top:16px; }
  .card { padding:16px; min-height:0; }
  .nav button { flex:1 1 45%; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到卡片区</a>
<div class="top">
  <div class="title">学习卡 <span class="sub">· AI 五篇合集</span></div>
  <a class="back" href="index.html">← 返回合集</a>
  <label class="visually-hidden" for="deckSel">卡堆</label>
  <select id="deckSel"><option value="all">全部卡堆</option></select>
  <label class="visually-hidden" for="bookSel">篇目</label>
  <select id="bookSel"><option value="all">全部篇目</option></select>
  <label><input type="checkbox" id="onlyNew"> 只看未标“会”</label>
  <button id="shuffleBtn">洗牌</button>
  <button id="resetBtn">重置进度</button>
  <button id="themeBtn">◐</button>
  <span class="progress" id="prog"></span>
  <div class="printbar">
    <button id="printFront">打印正面</button>
    <button id="printBack">打印背面</button>
    <span>先打正面，翻面后打背面；章核心/术语为固定卡（62mm），误解/自检为学习单自动高度。</span>
  </div>
</div>

<main class="stage" id="main">
  <div class="card">
    <div class="card-head"><span class="meta" id="cardMeta"></span><span id="counter" aria-live="polite"></span></div>
    <div class="card-body" id="cardBody">
      <div id="front"></div>
      <div class="hint" id="hintBox" hidden></div>
      <div id="back" hidden></div>
    </div>
    <div class="card-foot"><span class="src" id="srcLabel"></span><a id="srcLink" href="index.html">回看正文 ↗</a></div>
  </div>
  <div class="nav">
    <button id="prevBtn">← 上一张</button>
    <button id="flipBtn" class="primary">翻面（空格）</button>
    <button id="hintBtn">提示</button>
    <button id="nextBtn">下一张 →</button>
    <button id="knownBtn" class="ok">会</button>
    <button id="unknownBtn" class="no">不会</button>
  </div>
  <div class="tip">空格翻面 · ←/→ 切换 · H 提示 · J 会 · K 不会 · 进度存于本机浏览器</div>
</main>

<div id="printArea"></div>

<script>
const CARDS = {{CARDS_JSON}};
const DECK_LABELS = {{DECK_LABELS}};
const BY_ID = {};
CARDS.forEach(function (c) { BY_ID[c.id] = c; });
const PROG_KEY = 'ai-primer-cards-progress';

const state = { deck:'all', book:'all', onlyNew:false, order:[], idx:0, flipped:false, hint:false };
let progress = {};
try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || '{}') || {}; } catch (e) { progress = {}; }

function saveProgress() {
  try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {}
}
function buildOrder() {
  let list = CARDS.filter(function (c) {
    if (state.deck !== 'all' && c.deck !== state.deck) return false;
    if (state.book !== 'all' && c.book !== state.book) return false;
    if (state.onlyNew && progress[c.id] === 'known') return false;
    return true;
  });
  state.order = list.map(function (c) { return c.id; });
  state.idx = Math.min(state.idx, Math.max(0, state.order.length - 1));
  state.flipped = false; state.hint = false;
  render();
}
function current() { return BY_ID[state.order[state.idx]]; }
function statusText() {
  const total = state.order.length;
  const known = state.order.filter(function (id) { return progress[id] === 'known'; }).length;
  return (state.idx + 1) + '/' + total + ' · 会 ' + known;
}
function render() {
  const c = current();
  const els = {
    meta: document.getElementById('cardMeta'),
    counter: document.getElementById('counter'),
    front: document.getElementById('front'),
    back: document.getElementById('back'),
    hintBox: document.getElementById('hintBox'),
    hintBtn: document.getElementById('hintBtn'),
    srcLink: document.getElementById('srcLink'),
    srcLabel: document.getElementById('srcLabel'),
    prog: document.getElementById('prog'),
  };
  els.prog.textContent = statusText();
  els.counter.textContent = state.order.length ? (state.idx + 1) + '/' + state.order.length : '';
  if (!c) { els.front.textContent = '（当前筛选下没有卡片）'; els.back.innerHTML=''; els.meta.textContent=''; return; }
  els.meta.textContent = DECK_LABELS[c.deck] + ' · ' + (c.book_label || '') +
    (c.chapter ? ' · ' + c.chapter : '') + (c.group ? ' · ' + c.group : '');
  els.front.innerHTML = c.front_html || '';
  const parts = [];
  if (c.echo_html) parts.push('<div class="echo">' + c.echo_html + '</div>');
  parts.push(c.back_html || '');
  els.back.innerHTML = parts.join('');
  if (c.hint_html) { els.hintBox.innerHTML = c.hint_html; els.hintBtn.style.display = ''; }
  else { els.hintBox.innerHTML = ''; els.hintBtn.style.display = 'none'; }
  els.hintBox.hidden = !state.hint;
  els.back.hidden = !state.flipped;
  els.front.hidden = state.flipped;
  if (c.anchor) { els.srcLink.href = 'index.html#' + c.anchor; els.srcLink.style.display = ''; }
  else { els.srcLink.style.display = 'none'; }
  els.srcLabel.textContent = c.source_label ? ('来源：' + c.source_label) : '';
  renderMath(els.front); renderMath(els.back); renderMath(els.hintBox);
}
function renderMath(el) {
  if (window.renderMathInElement && el) {
    renderMathInElement(el, {
      delimiters: [{left:'\\(', right:'\\)', display:false}, {left:'\\[', right:'\\]', display:true}],
      output:'html', ignoredTags:['script','noscript','style','textarea','pre','code'], throwOnError:false
    });
  }
}
function flip() { state.flipped = !state.flipped; render(); }
function step(d) {
  if (!state.order.length) return;
  state.idx = (state.idx + d + state.order.length) % state.order.length;
  state.flipped = false; state.hint = false; render();
}
function mark(kind) {
  const c = current(); if (!c) return;
  progress[c.id] = kind; saveProgress();
  if (state.onlyNew && kind === 'known') { buildOrder(); return; }
  step(1);
}

/* ===== 筛选与按钮 ===== */
const bookSel = document.getElementById('bookSel');
const seenBooks = [];
CARDS.forEach(function (c) { if (c.book && seenBooks.indexOf(c.book) === -1) seenBooks.push(c.book); });
seenBooks.forEach(function (k) {
  const c = CARDS.find(function (x) { return x.book === k; });
  const o = document.createElement('option'); o.value = k; o.textContent = c.book_label; bookSel.appendChild(o);
});
/* 卡堆选项由 DECK_LABELS 单一源生成（T2 2026-10）；bookSel 已按 CARDS 书册动态生成 */
(function () {
  const sel = document.getElementById('deckSel');
  Object.keys(DECK_LABELS).forEach(function (k) {
    const o = document.createElement('option'); o.value = k; o.textContent = DECK_LABELS[k]; sel.appendChild(o);
  });
  sel.addEventListener('change', function (e) { state.deck = e.target.value; state.idx = 0; buildOrder(); });
})();
bookSel.addEventListener('change', function (e) { state.book = e.target.value; state.idx = 0; buildOrder(); });
document.getElementById('onlyNew').addEventListener('change', function (e) { state.onlyNew = e.target.checked; state.idx = 0; buildOrder(); });
document.getElementById('shuffleBtn').addEventListener('click', function () {
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.idx = 0; state.flipped = false; render();
});
document.getElementById('resetBtn').addEventListener('click', function () {
  if (confirm('重置全部“会/不会”进度？')) { progress = {}; saveProgress(); buildOrder(); }
});
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('prevBtn').addEventListener('click', function () { step(-1); });
document.getElementById('nextBtn').addEventListener('click', function () { step(1); });
document.getElementById('hintBtn').addEventListener('click', function () { state.hint = !state.hint; render(); });
document.getElementById('knownBtn').addEventListener('click', function () { mark('known'); });
document.getElementById('unknownBtn').addEventListener('click', function () { mark('unknown'); });
document.getElementById('themeBtn').addEventListener('click', function () {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('ai-primer-theme', t); } catch (e) {}
});
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'h' || e.key === 'H') { state.hint = !state.hint; render(); }
  else if (e.key === 'j' || e.key === 'J') mark('known');
  else if (e.key === 'k' || e.key === 'K') mark('unknown');
});

/* ===== 打印 ===== */
function doPrint(mode) {
  const area = document.getElementById('printArea');
  const cards = state.order.map(function (id) { return BY_ID[id]; });
  const shortDeck = cards.every(function (c) { return c.deck === 'core' || c.deck === 'term'; });
  area.className = 'sheet ' + (shortDeck ? 'mode-short' : 'mode-long') + ' ' + mode;
  area.innerHTML = cards.map(function (c) {
    const back = mode === 'print-back' ? (
      '<div class="pecho">' + (c.echo_html || '') + '</div>' +
      '<div class="card-back">' + (c.back_html || '') + '</div>' +
      '<div class="psrc">' + (DECK_LABELS[c.deck] + ' · ' + (c.source_label || '')) + '</div>') : '';
    return '<div class="pcard"><div class="phead">' + DECK_LABELS[c.deck] + ' · ' + c.id + '</div>' +
           '<div class="pfront">' + (c.front_html || '') + '</div>' + back + '</div>';
  }).join('');
  renderMath(area);
  window.print();
}
document.getElementById('printFront').addEventListener('click', function () { doPrint('print-front'); });
document.getElementById('printBack').addEventListener('click', function () { doPrint('print-back'); });

buildOrder();
</script>
</body>
</html>
